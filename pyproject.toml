[project]
name = "llaccel"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
llaccel-export = "llaccel.export:main"
llaccel-train = "llaccel.train:main"
llaccel-golden = "llaccel.golden:main"
llaccel-verify = "llaccel.verify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/llaccel"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
